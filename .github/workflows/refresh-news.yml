name: Refresh news data

# Keeps data/news.json and data/resources.json fresh by re-running the
# ingestion scripts and committing any changes straight back to `main`.
# Runs once a day (plus on-demand via workflow_dispatch) so the home page,
# GitHub page, and Ask page always reflect roughly the last 24 hours of
# upstream RSS/Atom feed and GitHub Releases activity.
on:
  schedule:
    # Every day at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Ingest news
        run: npm run ingest
        env:
          # Raises the GitHub API rate limit for the release-notes sources
          # (60 -> 5,000 requests/hour) and reduces flakiness.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh resource star counts
        run: npm run ingest:resources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated data (if changed)
        run: |
          if git diff --quiet -- data/news.json data/resources.json; then
            echo "No data changes; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/resources.json
          git commit -m "chore: daily news data refresh [skip ci]"
          git push
